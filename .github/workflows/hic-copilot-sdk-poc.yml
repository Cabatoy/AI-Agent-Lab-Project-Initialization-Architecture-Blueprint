name: HIC Copilot SDK PoC (offline)

on:
  pull_request:
    branches:
      - develop
      - main
      - feature/issue-88-copilot-sdk-poc
      - feature/issue-90-copilot-sdk-s2-readiness
    paths:
      - 'tools/dev-handoff/copilot-sdk-poc/**'
      - '.github/workflows/hic-copilot-sdk-poc.yml'

permissions:
  contents: read

jobs:
  offline:
    name: Offline fake-transport tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Confirm checkout is the exact PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node -e "const { execFileSync } = require('node:child_process'); const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (head !== process.env.EXPECTED_HEAD_SHA) process.exit(1); console.log('Checked out exact PR head');"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/dev-handoff/copilot-sdk-poc/package-lock.json
      - name: Install pinned dependencies without SDK runtime binaries
        working-directory: tools/dev-handoff/copilot-sdk-poc
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Typecheck and run fake-transport tests
        working-directory: tools/dev-handoff/copilot-sdk-poc
        run: npm run check
