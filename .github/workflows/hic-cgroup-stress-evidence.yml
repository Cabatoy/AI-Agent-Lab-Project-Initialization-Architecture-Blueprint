name: HIC Disposable Cgroup Stress Evidence (Synthetic Only)

on:
  push:
    branches:
      - experiment/hic-cgroup-stress-evidence
    paths:
      - .github/workflows/hic-cgroup-stress-evidence.yml
  workflow_dispatch:

permissions: {}

jobs:
  synthetic-stress:
    name: Bounded CPU, PID and OOM enforcement probes
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install Podman only if missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq podman uidmap slirp4netns fuse-overlayfs
          fi
          podman info --format 'rootless={{.Host.Security.Rootless}} cgroupManager={{.Host.CgroupManager}} cgroupVersion={{.Host.CgroupsVersion}}'

      - name: Pull fixed synthetic image, no source checkout or secrets
        shell: bash
        run: |
          set -euo pipefail
          podman pull docker.io/library/alpine:3.20
          podman image inspect docker.io/library/alpine:3.20 --format 'image={{.Id}}'

      - name: CPU quota must actually throttle busy workload
        shell: bash
        run: |
          set -euo pipefail
          timeout 35s podman run --rm --pull=never \
            --user 10001:10001 --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --cpus 0.5 \
            --memory 134217728 --pids-limit 32 \
            docker.io/library/alpine:3.20 sh -ec '
              test "$(id -u)" = 10001
              quota=$(cat /sys/fs/cgroup/cpu.max)
              test "$quota" = "50000 100000"
              before=$(awk "/^nr_throttled / {print \$2}" /sys/fs/cgroup/cpu.stat)
              end=$(( $(date +%s) + 6 ))
              while [ "$(date +%s)" -lt "$end" ]; do :; done
              after=$(awk "/^nr_throttled / {print \$2}" /sys/fs/cgroup/cpu.stat)
              echo "CPU quota=$quota nr_throttled_before=$before nr_throttled_after=$after"
              test "$after" -gt "$before"
              echo "PASS: observed CPU quota throttling"
            '

      - name: PID ceiling must reject excess child processes
        shell: bash
        run: |
          set -euo pipefail
          set +e
          result=$(timeout 35s podman run --rm --pull=never \
            --user 10001:10001 --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 16 \
            --memory 134217728 --cpus 0.5 \
            docker.io/library/alpine:3.20 sh -c '
              test "$(cat /sys/fs/cgroup/pids.max)" = 16 || exit 88
              echo "PID_LIMIT_CONFIRMED=16"
              i=0
              while [ "$i" -lt 45 ]; do
                sleep 7 &
                i=$((i+1))
              done
              echo "ERROR: PID exhaustion unexpectedly allowed"
              exit 89
            ' 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$result"
          echo "PID probe container_exit=$rc"
          # BusyBox ash itself may terminate on failed fork, before it can read pids.events.
          # Require both the observed cgroup limit and the kernel fork-denial diagnostic.
          test "$rc" -eq 2
          grep -Fqx 'PID_LIMIT_CONFIRMED=16' <<< "$result" || grep -Fq 'PID_LIMIT_CONFIRMED=16' <<< "$result"
          grep -Fq "can't fork: Resource temporarily unavailable" <<< "$result"
          echo "PASS: cgroup PID ceiling caused an observable fork denial"

      - name: Memory overuse must cause container OOM, not runner OOM
        shell: bash
        run: |
          set -euo pipefail
          # Force an anonymous-memory OOM in a subprocess so the container's
          # supervising shell can read authoritative kernel memory.events.
          timeout 45s podman run --rm --pull=never \
            --user 10001:10001 --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 67108864 --memory-swap 67108864 \
            --pids-limit 16 --cpus 0.5 \
            docker.io/library/alpine:3.20 sh -ec '
              test "$(cat /sys/fs/cgroup/memory.max)" = 67108864
              echo "MEMORY_LIMIT_CONFIRMED=67108864"
              before=$(awk "/^oom_kill / {print \$2}" /sys/fs/cgroup/memory.events)
              awk "BEGIN {
                chunk = \"x\"
                for (i = 0; i < 20; i++) chunk = chunk chunk
                for (i = 0; i < 256; i++) a[i] = chunk i
                print \"ERROR: memory stress allocation unexpectedly succeeded\"
                exit 99
              }" &
              child=$!
              set +e
              wait "$child"
              child_rc=$?
              set -e
              after=$(awk "/^oom_kill / {print \$2}" /sys/fs/cgroup/memory.events)
              echo "Memory probe child_exit=$child_rc kernel_oom_kill_before=$before kernel_oom_kill_after=$after"
              test "$child_rc" -eq 137
              test "$after" -gt "$before"
              echo "PASS: kernel cgroup OOM kill observed with surviving supervisor"
            '

      - name: Explicit evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "PASS: synthetic cgroup CPU/PID/memory stress only."
          echo "NOT CERTIFIED: hostile worktree races, network exfiltration, secrets, artifact export, crash/replay, independent reviewer."
          echo "Executor must remain fail-closed. No task execution was performed."

# HIC evidence-only workflow dispatch registration: synthetic tests, no checkout or secrets.
