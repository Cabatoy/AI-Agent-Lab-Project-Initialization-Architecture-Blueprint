name: HIC execution providers offline

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/Hic.ExecutionProviders/**'
      - 'tests/Hic.ExecutionProviders.Tests/**'
      - '.github/workflows/hic-execution-providers-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Release
        run: dotnet build tests/Hic.ExecutionProviders.Tests/Hic.ExecutionProviders.Tests.csproj -c Release
      - name: Test offline fakes
        run: dotnet test tests/Hic.ExecutionProviders.Tests/Hic.ExecutionProviders.Tests.csproj -c Release --no-build --no-restore
