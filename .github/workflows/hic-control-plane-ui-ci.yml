name: HIC Control Plane and Web UI CI

on:
  pull_request:
    branches: [develop]
    paths:
      - 'HumanInControl.sln'
      - 'AI-Agent-Lab.sln'
      - 'agent-lab/control-plane/**'
      - 'agent-lab/hic-native-host/**'
      - 'tests/Hic.NativeHost.Tests/**'
      - 'scripts/hic-native.ps1'
      - 'run-hic-native.cmd'
      - 'hic.cmd'
      - 'scripts/hic.ps1'
      - 'scripts/hic-launcher.offline.tests.ps1'
      - 'agent-lab/hic-web-ui/**'
      - 'tests/ControlPlane.Api.Tests/**'
      - '.github/workflows/hic-control-plane-ui-ci.yml'

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate solution projects
        run: dotnet sln HumanInControl.sln list
      - name: Build entire HIC solution
        run: dotnet build HumanInControl.sln -c Release
      - name: Run safe Control Plane tests
        run: dotnet test tests/ControlPlane.Api.Tests/ControlPlane.Api.Tests.csproj -c Release
      - name: Run Native Host policy tests
        run: dotnet test tests/Hic.NativeHost.Tests/Hic.NativeHost.Tests.csproj -c Release

  web-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-lab/hic-web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent-lab/hic-web-ui/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build UI
        run: npm run build
      - name: Run UI and proxy tests
        run: npm test

  launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate offline HIC launcher contract
        shell: pwsh
        run: ./scripts/hic-launcher.offline.tests.ps1
