services:
  postgres:
    image: postgres:16-alpine
    container_name: agentlab-postgres
    environment:
      POSTGRES_USER: agentlab
      POSTGRES_PASSWORD: agentlab
      POSTGRES_DB: agentlab
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentlab -d agentlab"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: agentlab-redis
    volumes:
      - redis-data:/data

  control-plane:
    build:
      context: ./src/ControlPlane
      dockerfile: Dockerfile
    container_name: agentlab-control-plane
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=agentlab;Username=agentlab;Password=agentlab
      ConnectionStrings__Redis: redis:6379
      MODEL_PROVIDER: ${MODEL_PROVIDER:-disabled}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:${HIC_CONTROL_PLANE_PORT:-19480}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  agent-worker:
    # Disabled by default. Requires explicit execution profile and separate approval.
    profiles: ['manual-worker']
    build:
      context: ./src/AgentWorker
      dockerfile: Dockerfile
    container_name: agentlab-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      CONTROL_PLANE_URL: http://control-plane:8080
      ConnectionStrings__Redis: redis:6379
      TASK_QUEUE_KEY: agentlab:task-queue
      MODEL_PROVIDER: ${MODEL_PROVIDER:-disabled}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
    depends_on:
      - control-plane
      - redis

volumes:
  postgres-data:
  redis-data:
